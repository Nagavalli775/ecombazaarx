<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seller Sign Up — EcoBazaarX</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/sellerSignup.css">
</head>

<body>

    <main class="seller-page">
        <div class="seller-card">

            <h1>Register as a Seller</h1>
            <p class="subtitle">Join EcoBazaarX and reach customers looking for sustainable products.</p>

            <div id="formFeedback"></div>

            <form id="sellerForm" novalidate>

                <div class="form-grid">

                    <div class="field full">
                        <label for="username">Username *</label>
                        <input id="username" name="username" type="text">
                        <div class="err" id="err_username"></div>
                    </div>

                    <div class="field">
                        <label for="email">Email *</label>
                        <input id="email" name="email" type="email">
                        <div class="err" id="err_email"></div>
                    </div>

                    <div class="field">
                        <label for="phone">Phone *</label>
                        <input id="phone" name="phone" type="tel" placeholder="10-digit mobile">
                        <div class="err" id="err_phone"></div>
                    </div>

                    <div class="field">
                        <label for="password">Password *</label>
                        <input id="password" name="password" type="password">
                        <div class="err" id="err_password"></div>
                    </div>

                    <!-- <div class="field">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input id="confirmPassword" name="confirmPassword" type="password">
                        <div class="err" id="err_confirmPassword"></div>
                    </div> -->

                    <div class="field full">
                        <label for="shopName">Shop Name *</label>
                        <input id="shopName" name="shopName" type="text">
                        <div class="err" id="err_shopName"></div>
                    </div>

                    <div class="field full">
                        <label for="shopAddress">Shop Address *</label>
                        <textarea id="shopAddress" name="shopAddress"></textarea>
                        <div class="err" id="err_shopAddress"></div>
                    </div>

                    <div class="field">
                        <label for="businessType">Business Type *</label>
                        <select id="businessType" name="businessType">
                            <option value="">Select...</option>
                            <option value="Retail">Retail</option>
                            <option value="Manufacturer">Manufacturer</option>
                            <option value="Wholesaler">Wholesaler</option>
                            <!-- <option value="Artisan">Artisan</option> -->
                            <!-- <option value="Other">Other</option> -->
                        </select>
                        <div class="err" id="err_businessType"></div>
                    </div>

                    <div class="field">
                        <label for="gstNumber">GST Number (Optional)</label>
                        <input id="gstNumber" name="gstNumber" type="text">
                    </div>

                    <div class="field">
                        <label for="bankAccountNumber">Bank Account Number *</label>
                        <input id="bankAccountNumber" name="bankAccountNumber" type="text">
                        <div class="err" id="err_bankAccountNumber"></div>
                    </div>

                    <div class="field">
                        <label for="ifscCode">IFSC Code *</label>
                        <input id="ifscCode" name="ifscCode" type="text">
                        <div class="err" id="err_ifscCode"></div>
                    </div>

                    <div class="field full">
                        <div class="terms-row">
                            <!-- <input id="termsAccepted" name="termsAccepted" type="checkbox">
                            <label for="termsAccepted">I accept the Terms & Conditions.</label> -->
                            <label for="termsAccepted">Terms and Conditions Accepted *</label>
                            <input id="termsAccepted" name="termsAccepted" type="text" placeholder="true or false">
                        </div>
                        <div class="err" id="err_termsAccepted"></div>
                    </div>

                </div>

                <div class="actions">
                    <button type="submit" class="btn-primary">Create Account</button>
                    <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
                </div>

            </form>
        </div>
    </main>

    <script src="/js/sellerapi.js"></script>
</body>

</html>
